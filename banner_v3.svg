<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <style>
      .hi-there { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 64px; font-weight: bold; fill: #ffffff; }
      .name { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #ffffff; }
    </style>
    <linearGradient id="waveGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#F09819" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Orange/Red Wave Shape -->
  <path fill="url(#waveGradient)" d="M0,40 L850,40 L850,110 C500,160 300,70 0,110 Z" />

  <!-- Text content -->
  <text x="425" y="190" class="hi-there" text-anchor="middle">Hi There! 👋</text>
  <text x="425" y="260" class="name" text-anchor="middle">I am Kunal Kamod.</text>
</svg>
